apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-telegram-bot
  namespace: argocd
  labels:
    app: argocd-telegram-bot
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-telegram-bot-reader
  namespace: argocd
  labels:
    app: argocd-telegram-bot
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - applications
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-telegram-bot-reader-binding
  namespace: argocd
  labels:
    app: argocd-telegram-bot
subjects:
  - kind: ServiceAccount
    name: argocd-telegram-bot
    namespace: argocd
roleRef:
  kind: Role
  name: argocd-telegram-bot-reader
  apiGroup: rbac.authorization.k8s.io
